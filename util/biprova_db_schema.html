
<style>
  #erd { padding: 1rem 0; }
  #erd svg { width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const diagram = `erDiagram
  users {
    uuid id PK
    text email
    text name
    text city
    bool is_remote
    text skills
    text avatar_url
    text linkedin_url
    text badge
    timestamp created_at
  }
  projects {
    uuid id PK
    uuid creator_id FK
    text title
    text description
    text city
    bool is_remote
    text category
    text status
    timestamp created_at
  }
  project_roles {
    uuid id PK
    uuid project_id FK
    text role_name
    bool is_filled
    uuid filled_by FK
  }
  applications {
    uuid id PK
    uuid project_id FK
    uuid user_id FK
    uuid role_id FK
    text note
    text status
    timestamp created_at
  }
  teams {
    uuid id PK
    uuid project_id FK
    uuid leader_id FK
    text status
    timestamp formed_at
    timestamp deadline
    timestamp kickoff_at
  }
  team_members {
    uuid id PK
    uuid team_id FK
    uuid user_id FK
    uuid role_id FK
    timestamp joined_at
  }
  messages {
    uuid id PK
    uuid team_id FK
    uuid sender_id FK
    text content
    timestamp created_at
  }
  notifications {
    uuid id PK
    uuid user_id FK
    text type
    text payload
    bool is_read
    timestamp created_at
  }
  waitlist {
    uuid id PK
    text email
    timestamp created_at
  }

  users ||--o{ projects : "açar"
  users ||--o{ applications : "başvurur"
  users ||--o{ team_members : "üye olur"
  users ||--o{ messages : "gönderir"
  users ||--o{ notifications : "alır"
  projects ||--o{ project_roles : "içerir"
  projects ||--|| teams : "oluşturur"
  project_roles ||--o{ applications : "hedef"
  project_roles ||--o{ team_members : "rol"
  applications }o--|| users : "başvuran"
  teams ||--o{ team_members : "üyeler"
  teams ||--o{ messages : "chat"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
